<!DOCTYPE html>
<html lang="en">
<head>
 <meta property="og:image" content="यहाँ_अपनी_इमेज_का_लिंक_डालो">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover</title>
<link rel="icon" type="image/png" href="favicon.png">
  <!-- Adsterra Ad Code -->
  <script type='text/javascript' src='//pl25890838.cpmrevenuegate.com/2b/43/e7/2b43e7428f5d085939eb90a3cdb90a6f.js'></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 20px; }
    input[type="file"] { margin: 15px 0; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1d4ed8; }
    #loader { display: none; margin-top: 15px; color: #38bdf8; }
    #result img { max-width: 100%; border-radius: 8px; margin-top: 20px; }
    .download-btn { display: none; background: #22c55e; margin-top: 15px; }
  </style>
 <!-- 1. फेसबुक और सोशल मीडिया पर बैनर दिखाने के लिए Meta Tags -->
<meta property="og:image" content="https://urbanbg-official.github.io/ai-background-remover/banner.jpg" />
<meta property="og:title" content="UrbanBG AI - 100% Free AI Background Remover" />
<meta property="og:description" content="Remove image background in 1-click for free!" />

<script src="https://pl30728362.effectivecpmnetwork.com/13/77/3e/13773e3b0da42fa00681a34387bd7aca.js"></script>
<body>

  <div class="card">
    <h2>urbanbg-official</h2>
    <input type="file" id="imageInput" accept="image/*"><br>
    <button onclick="removeBg()">Remove Background</button>
    <div id="loader">Processing Image... Please Wait...</div>
    <div id="result"></div>
    <a id="downloadBtn" download="bg-removed.png"><button class="download-btn" id="dlBtn">Download Image</button></a>
  </div>

  <script>
    async function removeBg() {
      const input = document.getElementById('imageInput');
      const loader = document.getElementById('loader');
      const result = document.getElementById('result');
      const downloadBtn = document.getElementById('downloadBtn');
      const dlBtn = document.getElementById('dlBtn');

      if (!input.files[0]) {
        alert('Please choose an image first!');
        return;
      }

      loader.style.display = 'block';
      result.innerHTML = '';
      dlBtn.style.display = 'none';

      const formData = new FormData();
      formData.append('image_file', input.files[0]);

      try {
        const response = await fetch('https://api.imgly.com/v1/background-removal', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          // Fallback to free serverless processing
          const altResponse = await fetch('https://clipdrop-api.co/remove-background/v1', {
            method: 'POST',
            headers: { 'x-api-key': '04123a6774a8a6493b22ed7010452382f6e5200c9e64e9a03975a89f92e400490b4d4586f1e285098bd' },
            body: formData
          });
          const blob = await altResponse.blob();
          showResult(blob);
        } else {
          const blob = await response.blob();
          showResult(blob);
        }
      } catch (err) {
        // Backup direct processing
        try {
          const formData2 = new FormData();
          formData2.append('image_file', input.files[0]);
          const res2 = await fetch('https://api.remove.bg/v1.0/removebg', {
            method: 'POST',
            headers: { 'X-Api-Key': 'iZXBX5vdGJwnuPzJeDvQPuT3' },
            body: formData2
          });
          if(res2.ok) {
            const blob2 = await res2.blob();
            showResult(blob2);
          } else {
            alert('Service busy, please try again in a moment!');
          }
        } catch(e) {
          alert('Error processing image. Please try another image.');
        }
      } finally {
        loader.style.display = 'none';
      }
    }

    function showResult(blob) {
      const url = URL.createObjectURL(blob);
      document.getElementById('result').innerHTML = `<img src="${url}">`;
      const downloadBtn = document.getElementById('downloadBtn');
      const dlBtn = document.getElementById('dlBtn');
      downloadBtn.href = url;
      dlBtn.style.display = 'inline-block';
    }
  </script>

</body>
</html>
