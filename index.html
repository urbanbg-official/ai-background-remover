<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanBG AI - Ultra Fast</title>
  <style>
    body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 15px; }
    #upload { background: #22c55e; padding: 15px; border-radius: 10px; cursor: pointer; display: block; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>UrbanBG AI</h1>
    <p>Removing background locally...</p>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="process(event)">
    <label for="fileInput" id="upload">📁 Choose Image</label>
    <div id="status" style="margin-top:20px;">Waiting...</div>
    <img id="res" style="max-width:100%; margin-top:15px; display:none;">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
  <script>
    async function process(e) {
      const status = document.getElementById('status');
      const res = document.getElementById('res');
      const file = e.target.files[0];
      
      status.innerText = "⚡ Processing (Wait 5-10s)...";
      
      try {
        // यह सीधे तेरे ब्राउज़र में काम करेगा, सर्वर की ज़रूरत ही नहीं है!
        const blob = await imglyRemoveBackground(file);
        const url = URL.createObjectURL(blob);
        res.src = url;
        res.style.display = 'block';
        status.innerText = "✅ Success!";
      } catch (err) {
        status.innerText = "❌ Error: Browser Memory Full. Refresh page.";
      }
    }
  </script>
</body>
</html>
