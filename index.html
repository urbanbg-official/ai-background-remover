<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanBG AI - HD Background Remover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 450px; background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { color: #22c55e; font-size: 26px; margin-bottom: 10px; }
    .upload-section { border: 2px dashed #22c55e; padding: 30px; border-radius: 15px; cursor: pointer; background: #0f172a; margin-top: 20px; }
    .upload-section:hover { background: #16a34a; }
    #fileInput { display: none; }
    .btn { background: #22c55e; border: none; color: white; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; }
    #resultImg { margin-top: 20px; max-width: 100%; border-radius: 10px; display: none; }
  </style>
</head>
<body>

  <!-- Adsterra Sticky Banner -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>
      atOptions = {
        'key' : 'f13146991eed004d9d88689beb216a77',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <div class="container">
    <h1>UrbanBG AI</h1>
    <p>Professional HD Background Remover</p>

    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
      <p>📁 Drop Image or Click to Upload</p>
      <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
    </div>

    <button class="btn" onclick="removeBackground()">Remove Background Now</button>
    
    <div id="resultArea">
      <img id="resultImg" src="" alt="Result">
    </div>
  </div>

  <script>
    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const img = document.getElementById('resultImg');
        img.src = reader.result;
        img.style.display = 'block';
      }
      reader.readAsDataURL(event.target.files[0]);
    }

    function removeBackground() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) { alert("Please upload an image first!"); return; }
      
      // Professional API Integration: 
      // Jivan, to get REAL HD results, use Remove.bg API key.
      alert("Professional AI processing initiated! Redirecting to HD removal engine...");
      window.open("https://www.remove.bg/upload", "_blank");
    }
  </script>
</body>
</html>
