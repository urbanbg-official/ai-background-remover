<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanBG AI - Professional HD Remover</title>
  <!-- AI Model Loading -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #22c55e; margin-bottom: 5px; }
    .upload-btn { background: #22c55e; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 15px; }
    canvas { max-width: 100%; margin-top: 20px; border-radius: 10px; background: #0f172a; }
    .download-btn { background: #38bdf8; color: #0f172a; padding: 15px 30px; border-radius: 10px; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <!-- Adsterra Banner -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>
      atOptions = {'key':'f13146991eed004d9d88689beb216a77','format':'iframe','height':50,'width':320,'params':{}};
    </script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <div class="container">
    <h1>UrbanBG AI</h1>
    <p>Professional HD In-App Removal</p>
    
    <label class="upload-btn" for="fileInput">Choose Image</label>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="runAI(event)">
    
    <div id="status" style="margin-top:15px; color:#f43f5e;">Waiting for image...</div>
    <canvas id="output"></canvas>
    <button class="download-btn" id="dlBtn" style="display:none;" onclick="downloadHD()">📥 Download HD Image</button>
  </div>

  <script>
    async function runAI(event) {
      const status = document.getElementById('status');
      const canvas = document.getElementById('output');
      const dlBtn = document.getElementById('dlBtn');
      const img = new Image();
      img.src = URL.createObjectURL(event.target.files[0]);
      
      status.innerText = "Loading AI & Processing (This takes 5-10 seconds)...";
      
      const net = await bodyPix.load();
      const segmentation = await net.segmentPerson(img);
      
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixel = imageData.data;
      
      for (let i = 0; i < segmentation.data.length; i++) {
        if (segmentation.data[i] === 0) {
          pixel[i * 4 + 3] = 0; // Remove BG
        }
      }
      ctx.putImageData(imageData, 0, 0);
      status.innerText = "Done! HD Background Removed.";
      dlBtn.style.display = 'block';
    }

    function downloadHD() {
      const link = document.createElement('a');
      link.download = 'UrbanBG_HD_Result.png';
      link.href = document.getElementById('output').toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
