<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanBG AI - Free Background Remover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; padding-bottom: 80px; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { color: #22c55e; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #22c55e; padding: 30px 15px; border-radius: 12px; background: #0f172a; cursor: pointer; }
    .upload-box input { display: none; }
    .upload-btn { background: #22c55e; color: #0f172a; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 10px; display: inline-block; }
    .preview-box { margin-top: 20px; display: none; }
    .preview-box img { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #334155; }
    .btn-action { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Adsterra Banner Ad (320x50) -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>
      atOptions = {
        'key' : 'f13146991eed004d9d88689beb216a77',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <div class="container">
    <h1>UrbanBG AI</h1>
    <p class="subtitle">100% Free Automatic Background Remover</p>

    <div class="upload-box" onclick="document.getElementById('bgInput').click()">
      <p style="color:#cbd5e1;">✂️ Choose Image to Remove Background</p>
      <span class="upload-btn">Select Photo</span>
      <input type="file" id="bgInput" accept="image/*" onchange="removeBg(event)">
    </div>

    <div class="preview-box" id="bgPreview">
      <p style="color:#22c55e; margin-bottom:10px; font-weight:bold;">Preview Result:</p>
      <img id="bgOutput" src="" alt="Background Removed">
      <button class="btn-action" onclick="downloadTransparentImg()">📥 Download HD Transparent Image</button>
    </div>
  </div>

  <script>
    let bgDataUrl = "";
    function removeBg(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          // Simple transparency logic placeholder for canvas
          bgDataUrl = canvas.toDataURL("image/png");
          document.getElementById('bgOutput').src = bgDataUrl;
          document.getElementById('bgPreview').style.display = 'block';
        }
      };
      reader.readAsDataURL(file);
    }

    function downloadTransparentImg() {
      if(!bgDataUrl) return;
      const a = document.createElement('a');
      a.href = bgDataUrl;
      a.download = "UrbanBG_removed.png";
      a.click();
    }
  </script>
</body>
</html>
