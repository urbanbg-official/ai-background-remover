
        <button id="downloadBtn">📥 Download Clean Image</button>

        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultDiv = document.getElementById('result');
        let downloadUrl = '';

        imageInput.addEventListener('change', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            // UI Reset
            resultDiv.innerHTML = '';
            downloadBtn.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                // यहाँ आपकी असली API Key पहले से काम कर रही है
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-API-Key': 'iZXBX5vdGJwnuPzJeDvQPuT3' }, // यहाँ आपकी चाबी लगी रहेगी
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    downloadUrl = URL.createObjectURL(blob);
                    
                    const img = document.createElement('img');
                    img.src = downloadUrl;
                    resultDiv.appendChild(img);
                    
                    downloadBtn.style.display = 'block';
                } else {
                    alert('Error: Please check your connection or API limit.');
                }
            } catch (error) {
                console.error(error);
                alert('Something went wrong. Please try again.');
            } finally {
                loader.style.display = 'none';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!downloadUrl) return;
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'no-bg-image.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>

</body>
</html>
