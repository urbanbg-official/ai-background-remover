<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanBG AI</title>
  <style>
    body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
    .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 15px; }
    .upload-btn { background: #22c55e; padding: 15px; display: block; border-radius: 10px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>UrbanBG AI</h1>
    <label class="upload-btn" for="fileInput">📁 Choose Image</label>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadImage(event)">
    <div id="status">Waiting for image...</div>
    <img id="resultImg" style="max-width:100%; display:none; margin-top:15px;">
  </div>

  <script>
    async function uploadImage(event) {
      const file = event.target.files[0];
      const status = document.getElementById('status');
      const resultImg = document.getElementById('resultImg');
      
      status.innerText = "⚡ Processing...";
      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("https://urbanbg-backend.onrender.com/remove-bg", {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Server is waking up...");

        const blob = await response.blob();
        resultImg.src = URL.createObjectURL(blob);
        resultImg.style.display = 'block';
        status.innerText = "✅ Done!";
      } catch (err) {
        status.innerText = "❌ Retrying... please wait.";
        setTimeout(() => location.reload(), 3000); // एरर आने पर ऑटो-रिलोड करेगा
      }
    }
  </script>
</body>
</html>
