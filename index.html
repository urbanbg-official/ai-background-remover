<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Compress AI - Free Image Resizer & Compressor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; padding-bottom: 80px; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #38bdf8; padding: 30px 15px; border-radius: 12px; background: #0f172a; cursor: pointer; text-align: center; }
    .upload-box:hover { border-color: #22c55e; }
    .upload-box input { display: none; }
    .upload-btn { background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 10px; display: inline-block; }
    .controls { display: none; margin-top: 20px; text-align: left; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #cbd5e1; font-weight: 600; }
    input[type="range"] { width: 100%; margin-top: 5px; accent-color: #38bdf8; }
    input[type="number"], select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-top: 5px; }
    .btn-action { width: 100%; background: #22c55e; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 20px; }
    .btn-action:hover { background: #16a34a; color: #fff; }
    .preview-box { margin-top: 20px; display: none; }
    .preview-box img { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #334155; }
    .info-text { font-size: 12px; color: #22c55e; margin-top: 8px; font-weight: bold; }
    .cross-promo { margin-top: 25px; padding: 12px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    .cross-promo p { font-size: 12px; color: #94a3b8; }
    .cross-promo a { display: inline-block; margin-top: 6px; color: #38bdf8; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

  <!-- Adsterra Sticky Banner Ad (320x50) Start -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>
      atOptions = {
        'key' : 'f13146991eed004d9d88689beb216a77',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>
  <!-- Adsterra Banner Ad End -->

  <div class="container">
    <h1>Urban Compress AI</h1>
    <p class="subtitle">100% Free Image Compressor & Resizer</p>

    <!-- Upload Section -->
    <div class="upload-box" onclick="document.getElementById('imgInput').click()">
      <p style="color:#cbd5e1;">📁 Choose or Drop Image Here</p>
      <span class="upload-btn">Select Photo</span>
      <input type="file" id="imgInput" accept="image/*">
    </div>

    <!-- Controls Section -->
    <div class="controls" id="controls">
      <label>Quality / Compression Level: <span id="qualityValue" style="color:#38bdf8;">80%</span></label>
      <input type="range" id="qualityRange" min="10" max="100" value="80">

      <label>Max Width (Pixels):</label>
      <input type="number" id="widthInput" placeholder="Auto (Default)">

      <label>Convert Format:</label>
      <select id="formatSelect">
        <option value="image/jpeg">JPG / JPEG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WEBP</option>
      </select>

      <button class="btn-action" onclick="compressImage()">⚡ Compress Image Now</button>
    </div>

    <!-- Preview & Download Section -->
    <div class="preview-box" id="previewBox">
      <img id="outputImg" src="" alt="Compressed Result">
      <p class="info-text" id="sizeInfo"></p>
      <button class="btn-action" style="background:#38bdf8;" onclick="downloadImage()">📥 Download HD Image</button>
    </div>

    <!-- Cross Promotion -->
    <div class="cross-promo">
      <p>Need to remove photo background?</p>

    </div>
  </div>

  <script>
    // आपका जावास्क्रिप्ट लॉजिक यहाँ रहेगा
  </script>
</body>
</html>
