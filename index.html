<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Modern & Precise AI Background Removal Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
  
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; margin: 0; padding-bottom: 80px; }
    .container { width: 100%; max-width: 450px; background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; box-sizing: border-box; }
    h1 { color: #22c55e; margin-bottom: 5px; }
    .upload-btn { background: #22c55e; color: #0f172a; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; display: block; margin-top: 20px; transition: 0.3s; }
    .upload-btn:hover { background: #16a34a; }
    #resultImg { max-width: 100%; border-radius: 10px; margin-top: 20px; display: none; background: url('data:image/png;base64,iVBORw0KGgoAAAANSU5EUgAAAAwAAAAMCAIAAADfeC0HAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAABwSURBVH3BAMBAC03a/xU2h0I4J8yAMf/R1mEDAE2AAnm1k+8AAAAASUVORK5CYII='); }
    .status { margin-top: 15px; color: #38bdf8; font-weight: bold; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h1>UrbanBG AI</h1>
    <p style="color: #94a3b8; font-size: 14px;">Unlimited HD Background Removal</p>
    
    <label class="upload-btn" for="fileInput">📁 Choose Image</label>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="processAI(event)">
    
    <div id="status" class="status">Waiting for image...</div>
    <img id="resultImg" alt="Result Image">
    <button id="dlBtn" onclick="downloadImg()" style="display:none; background:#38bdf8; color:#0f172a; border:none; padding:15px; width:100%; border-radius:10px; margin-top:15px; font-weight:bold; cursor:pointer;">📥 Download Transparent PNG</button>
  </div>

  <!-- Adsterra Banner (Intact & Untouched) -->
  <div style="text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; background: #1e293b; padding: 5px 0; border-top: 1px solid #334155;">
    <script>atOptions = {'key':'f13146991eed004d9d88689beb216a77','format':'iframe','height':50,'width':320,'params':{}};</script>
    <script src="https://www.highperformanceformat.com/f13146991eed004d9d88689beb216a77/invoke.js"></script>
  </div>

  <script>
    let downloadUrl = '';

    async function processAI(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('status');
      const resultImg = document.getElementById('resultImg');
      const dlBtn = document.getElementById('dlBtn');
      
      status.innerText = "⏳ Loading AI Engine... (First time takes 5-10 sec)";
      resultImg.style.display = 'none';
      dlBtn.style.display = 'none';
      
      try {
        // Run AI removal process directly in browser
        const blob = await imglyRemoveBackground(file, {
          progress: (key, current, total) => {
            if (key.includes('fetch')) {
              status.innerText = "⏳ Downloading AI Model...";
            } else {
              status.innerText = "⚡ Processing Image...";
            }
          }
        });

        downloadUrl = URL.createObjectURL(blob);
        resultImg.src = downloadUrl;
        resultImg.style.display = 'block';
        dlBtn.style.display = 'block';
        status.innerText = "✅ Success! Background Removed.";
      } catch (error) {
        console.error(error);
        status.innerText = "❌ Error processing image. Please try another image.";
      }
    }

    function downloadImg() {
      if (!downloadUrl) return;
      const link = document.createElement('a');
      link.download = 'UrbanBG_Transparent.png';
      link.href = downloadUrl;
      link.click();
    }
  </script>
</body>
</html>
