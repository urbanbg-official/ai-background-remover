
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Free AI Background Remover Online 2026</title>
    
    <!-- यह रहा आपका Adsterra विज्ञापन कोड -->
    <script src="https://pl30437055.effectivecpmnetwork.com/a7/52/74/a75274447bfcbd63f740a4442f500b28.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .file-upload {
            border: 2px dashed #007bff;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e9f2ff;
            transition: background 0.3s;
        }
        .file-upload:hover {
            background-color: #d6e7ff;
        }
        input[type="file"] {
            display: none;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            display: none;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 25px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Background Remover</h1>
        <p>1-Click HD Image Background Cutter & Eraser</p>
        
        <label class="file-upload">
            <input type="file" id="imageInput" accept="image/*">
            <span>📷 Choose or Drag an Image</span>
        </label>

        <div class="loader" id="loader"></div>
        <button id="downloadBtn">📥 Download Clean Image</button>

        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultDiv = document.getElementById('result');
        let downloadUrl = '';

        imageInput.addEventListener('change', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            // UI Reset
            resultDiv.innerHTML = '';
            downloadBtn.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                // यहाँ आपकी असली API Key पहले से काम कर रही है
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-API-Key': 'YOUR_ACTUAL_API_KEY_HERE' }, // यहाँ आपकी चाबी लगी रहेगी
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    downloadUrl = URL.createObjectURL(blob);
                    
                    const img = document.createElement('img');
                    img.src = downloadUrl;
                    resultDiv.appendChild(img);
                    
                    downloadBtn.style.display = 'block';
                } else {
                    alert('Error: Please check your connection or API limit.');
                }
            } catch (error) {
                console.error(error);
                alert('Something went wrong. Please try again.');
            } finally {
                loader.style.display = 'none';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!downloadUrl) return;
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'no-bg-image.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>

</body>
</html>
